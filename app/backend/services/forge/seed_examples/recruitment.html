<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招聘跟进</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --fg: #111827;
    --muted: #64748b;
    --border: #d8e2ee;
    --accent: #0ea5e9;
    --accent-soft: #e0f2fe;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --radius: 8px;
    --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 16px; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 18px;
  }

  .header-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .brand h1 {
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: 0;
  }

  .brand p {
    font-size: 0.875rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .stat-block {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 0;
  }

  .stat-number {
    font-family: var(--font-mono);
    font-size: 2rem;
    font-weight: 500;
    line-height: 1;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 0.8125rem;
    color: var(--muted);
  }

  /* ---------- Main ---------- */
  main {
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 24px 48px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-sans);
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1;
    padding: 9px 16px;
    min-height: 36px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 150ms, border-color 150ms, color 150ms;
    white-space: nowrap;
  }

  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #0284c7; border-color: #0284c7; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }
  .btn-ghost:hover { background: var(--bg); color: var(--fg); }

  .btn-text {
    background: transparent;
    color: var(--muted);
    border-color: transparent;
    padding: 6px 8px;
    min-height: 28px;
    font-size: 0.8125rem;
  }
  .btn-text:hover { color: var(--fg); background: var(--bg); }

  .btn-danger-text {
    background: transparent;
    color: var(--muted);
    border-color: transparent;
    padding: 6px 8px;
    min-height: 28px;
    font-size: 0.8125rem;
  }
  .btn-danger-text:hover { color: var(--danger); background: var(--danger-soft); }

  /* ---------- Filter tabs ---------- */
  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-left: auto;
  }

  .filter-tab {
    font-family: var(--font-sans);
    font-size: 0.8125rem;
    font-weight: 500;
    padding: 6px 12px;
    min-height: 30px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 150ms, color 150ms;
    white-space: nowrap;
  }
  .filter-tab:hover { background: var(--bg); color: var(--fg); }
  .filter-tab[aria-pressed="true"] {
    background: var(--surface);
    border-color: var(--border);
    color: var(--fg);
    font-weight: 600;
  }

  /* ---------- Table ---------- */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }

  thead th {
    text-align: left;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr { transition: background 150ms; }
  tbody tr:hover { background: #fafcff; }

  .cell-name {
    font-weight: 500;
    color: var(--fg);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cell-role {
    color: var(--muted);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stage-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    white-space: nowrap;
  }

  .stage-badge[data-stage="初筛"] { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
  .stage-badge[data-stage="一面"] { background: var(--accent-soft); color: #0369a1; border-color: #bae6fd; }
  .stage-badge[data-stage="二面"] { background: #fefce8; color: #a16207; border-color: #fef08a; }
  .stage-badge[data-stage="终面"] { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
  .stage-badge[data-stage="Offer"] { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }

  .cell-actions {
    display: flex;
    gap: 2px;
    justify-content: flex-end;
  }

  .col-actions { text-align: right; width: 1%; }

  /* ---------- Empty state ---------- */
  .empty-state {
    padding: 64px 24px;
    text-align: center;
  }

  .empty-state svg {
    width: 40px;
    height: 40px;
    color: var(--muted);
    opacity: 0.5;
    margin-bottom: 16px;
  }

  .empty-state h2 {
    font-size: 1.125rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .empty-state p {
    font-size: 0.875rem;
    color: var(--muted);
    max-width: 36ch;
    margin: 0 auto 20px;
  }

  /* ---------- Alert banner ---------- */
  .alert-banner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 0.8125rem;
    line-height: 1.5;
    margin-bottom: 20px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
  }

  .alert-banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  .alert-banner .alert-close {
    margin-left: auto;
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
    opacity: 0.6;
    padding: 0 2px;
    font-size: 1rem;
    line-height: 1;
  }
  .alert-banner .alert-close:hover { opacity: 1; }

  /* ---------- Modal ---------- */
  dialog {
    border: none;
    border-radius: 12px;
    padding: 0;
    width: min(480px, calc(100vw - 32px));
    background: var(--surface);
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
    color: var(--fg);
  }

  dialog::backdrop {
    background: rgba(15, 23, 42, 0.35);
  }

  .modal-inner {
    padding: 24px;
  }

  .modal-title {
    font-size: 1.125rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 20px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    margin-bottom: 5px;
    color: var(--fg);
  }

  .field input,
  .field select {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 0.875rem;
    line-height: 1.5;
    padding: 9px 12px;
    min-height: 38px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--fg);
    transition: border-color 150ms, box-shadow 150ms;
  }

  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .field input:user-invalid,
  .field select:user-invalid {
    border-color: var(--danger);
  }

  .field input:user-invalid:focus,
  .field select:user-invalid:focus {
    box-shadow: 0 0 0 3px var(--danger-soft);
  }

  .field-error {
    font-size: 0.75rem;
    color: var(--danger);
    margin-top: 4px;
    display: none;
  }

  .field-error.visible { display: block; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 24px;
  }

  /* ---------- Footer ---------- */
  footer {
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 24px 24px;
    font-size: 0.75rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }

  /* ---------- Focus visible ---------- */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn:focus-visible,
  .filter-tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    header { padding: 16px 16px 14px; }
    main { padding: 20px 16px 40px; }
    .header-inner { flex-direction: column; align-items: flex-start; gap: 10px; }
    .stat-block { padding: 0; }
    .stat-number { font-size: 1.625rem; }
    .toolbar { gap: 8px; }
    .filter-tabs { margin-left: 0; width: 100%; }
    thead th { padding: 10px 12px; }
    tbody td { padding: 10px 12px; }
    .cell-name, .cell-role { max-width: 120px; }
    .col-actions { width: auto; }
    .cell-actions { flex-direction: column; gap: 0; }
    footer { padding: 12px 16px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>招聘跟进</h1>
      <p>追踪候选人从初筛到 Offer 的每一步</p>
    </div>
    <div class="stat-block" aria-live="polite">
      <span class="stat-number" id="statTotal">0</span>
      <span class="stat-label">位候选人跟进中</span>
    </div>
  </div>
</header>

<main>
  <div id="alertContainer"></div>

  <div class="toolbar">
    <button class="btn btn-primary" id="btnAdd" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新增候选人
    </button>
    <div class="filter-tabs" role="group" aria-label="按面试阶段筛选">
      <button class="filter-tab" type="button" data-filter="全部" aria-pressed="true">全部</button>
      <button class="filter-tab" type="button" data-filter="初筛" aria-pressed="false">初筛</button>
      <button class="filter-tab" type="button" data-filter="一面" aria-pressed="false">一面</button>
      <button class="filter-tab" type="button" data-filter="二面" aria-pressed="false">二面</button>
      <button class="filter-tab" type="button" data-filter="终面" aria-pressed="false">终面</button>
      <button class="filter-tab" type="button" data-filter="Offer" aria-pressed="false">Offer</button>
    </div>
  </div>

  <div id="tableContainer"></div>
</main>

<footer>
  数据保存在浏览器本地，仅当前设备可见。
</footer>

<!-- Modal -->
<dialog id="recordDialog" aria-labelledby="dialogTitle">
  <form class="modal-inner" id="recordForm" novalidate>
    <h2 class="modal-title" id="dialogTitle">新增候选人</h2>
    <input type="hidden" id="editId" value="">

    <div class="field">
      <label for="inputName">候选人姓名</label>
      <input type="text" id="inputName" name="name" required maxlength="40" autocomplete="off"
             aria-describedby="nameError">
      <div class="field-error" id="nameError" role="alert">请填写候选人姓名</div>
    </div>

    <div class="field">
      <label for="inputRole">应聘岗位</label>
      <input type="text" id="inputRole" name="role" required maxlength="60" autocomplete="off"
             aria-describedby="roleError">
      <div class="field-error" id="roleError" role="alert">请填写应聘岗位</div>
    </div>

    <div class="field">
      <label for="inputStage">面试阶段</label>
      <select id="inputStage" name="stage" required aria-describedby="stageError">
        <option value="">请选择阶段</option>
        <option value="初筛">初筛</option>
        <option value="一面">一面</option>
        <option value="二面">二面</option>
        <option value="终面">终面</option>
        <option value="Offer">Offer</option>
      </select>
      <div class="field-error" id="stageError" role="alert">请选择面试阶段</div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" type="button" id="btnCancel">取消</button>
      <button class="btn btn-primary" type="submit" id="btnSave">保存</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

  /* ========== Safe Storage Layer ========== */
  const STORAGE_KEY = 'recruit_tracker_v1';
  let memoryStore = null;
  let storageAvailable = true;

  function safeRead() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) return null;
      return JSON.parse(raw);
    } catch (e) {
      storageAvailable = false;
      return memoryStore;
    }
  }

  function safeWrite(data) {
    memoryStore = data;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      storageAvailable = false;
    }
  }

  /* ========== State ========== */
  const STAGES = ['初筛', '一面', '二面', '终面', 'Offer'];

  let records = [];
  let currentFilter = '全部';
  let alertDismissed = false;

  function loadRecords() {
    const stored = safeRead();
    if (Array.isArray(stored)) {
      records = stored;
    } else {
      records = [];
    }
  }

  function persist() {
    safeWrite(records);
  }

  /* ========== DOM refs ========== */
  const tableContainer = document.getElementById('tableContainer');
  const statTotal = document.getElementById('statTotal');
  const alertContainer = document.getElementById('alertContainer');
  const dialog = document.getElementById('recordDialog');
  const form = document.getElementById('recordForm');
  const dialogTitle = document.getElementById('dialogTitle');
  const editIdInput = document.getElementById('editId');
  const inputName = document.getElementById('inputName');
  const inputRole = document.getElementById('inputRole');
  const inputStage = document.getElementById('inputStage');
  const btnAdd = document.getElementById('btnAdd');
  const btnCancel = document.getElementById('btnCancel');

  /* ========== Alert ========== */
  function showStorageAlert() {
    if (!storageAvailable && !alertDismissed) {
      alertContainer.innerHTML =
        '<div class="alert-banner" role="status">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
        '<span>当前浏览器环境无法持久保存数据，本次会话内的修改仍可正常使用，关闭页面后将丢失。</span>' +
        '<button class="alert-close" type="button" aria-label="关闭提示">&times;</button>' +
        '</div>';
      const closeBtn = alertContainer.querySelector('.alert-close');
      closeBtn.addEventListener('click', function () {
        alertDismissed = true;
        alertContainer.innerHTML = '';
      });
    }
  }

  /* ========== Render ========== */
  function getFiltered() {
    if (currentFilter === '全部') return records;
    return records.filter(function (r) { return r.stage === currentFilter; });
  }

  function render() {
    const filtered = getFiltered();
    statTotal.textContent = records.length;

    if (records.length === 0) {
      tableContainer.innerHTML =
        '<div class="table-wrap"><div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>' +
        '<h2>还没有候选人记录</h2>' +
        '<p>添加第一位候选人，开始追踪招聘进度。</p>' +
        '<button class="btn btn-primary" type="button" id="emptyAddBtn">新增候选人</button>' +
        '</div></div>';
      document.getElementById('emptyAddBtn').addEventListener('click', openAddModal);
      return;
    }

    if (filtered.length === 0) {
      tableContainer.innerHTML =
        '<div class="table-wrap"><div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<h2>该阶段暂无候选人</h2>' +
        '<p>当前筛选条件下没有记录，切换筛选或新增一位候选人。</p>' +
        '<button class="btn btn-ghost" type="button" id="resetFilterBtn">查看全部</button>' +
        '</div></div>';
      document.getElementById('resetFilterBtn').addEventListener('click', function () {
        setFilter('全部');
      });
      return;
    }

    let rows = '';
    filtered.forEach(function (r) {
      const safeName = escapeHtml(r.name);
      const safeRole = escapeHtml(r.role);
      rows +=
        '<tr>' +
        '<td class="cell-name" title="' + safeName + '">' + safeName + '</td>' +
        '<td class="cell-role" title="' + safeRole + '">' + safeRole + '</td>' +
        '<td><span class="stage-badge" data-stage="' + escapeHtml(r.stage) + '">' + escapeHtml(r.stage) + '</span></td>' +
        '<td class="col-actions"><div class="cell-actions">' +
        '<button class="btn-text" type="button" data-edit="' + r.id + '">编辑</button>' +
        '<button class="btn-danger-text" type="button" data-delete="' + r.id + '">删除</button>' +
        '</div></td>' +
        '</tr>';
    });

    tableContainer.innerHTML =
      '<div class="table-wrap">' +
      '<table>' +
      '<thead><tr>' +
      '<th scope="col">候选人姓名</th>' +
      '<th scope="col">应聘岗位</th>' +
      '<th scope="col">面试阶段</th>' +
      '<th scope="col" class="col-actions">操作</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '</div>';

    tableContainer.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openEditModal(btn.getAttribute('data-edit'));
      });
    });
    tableContainer.querySelectorAll('[data-delete]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        deleteRecord(btn.getAttribute('data-delete'));
      });
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ========== Filter ========== */
  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(function (btn) {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-filter') === f ? 'true' : 'false');
    });
    render();
  }

  document.querySelectorAll('.filter-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setFilter(btn.getAttribute('data-filter'));
    });
  });

  /* ========== Modal ========== */
  function resetFormErrors() {
    ['nameError', 'roleError', 'stageError'].forEach(function (id) {
      document.getElementById(id).classList.remove('visible');
    });
    [inputName, inputRole, inputStage].forEach(function (el) {
      el.removeAttribute('aria-invalid');
    });
  }

  function openAddModal() {
    dialogTitle.textContent = '新增候选人';
    editIdInput.value = '';
    form.reset();
    resetFormErrors();
    dialog.showModal();
    inputName.focus();
  }

  function openEditModal(id) {
    const rec = records.find(function (r) { return r.id === id; });
    if (!rec) return;
    dialogTitle.textContent = '编辑候选人';
    editIdInput.value = id;
    inputName.value = rec.name;
    inputRole.value = rec.role;
    inputStage.value = rec.stage;
    resetFormErrors();
    dialog.showModal();
    inputName.focus();
  }

  btnAdd.addEventListener('click', openAddModal);
  btnCancel.addEventListener('click', function () { dialog.close(); });

  dialog.addEventListener('click', function (e) {
    if (e.target === dialog) dialog.close();
  });

  /* ========== Validation ========== */
  function validateField(el) {
    const errorId = el.id === 'inputName' ? 'nameError' : el.id === 'inputRole' ? 'roleError' : 'stageError';
    const errorEl = document.getElementById(errorId);
    const valid = el.value.trim() !== '';
    if (!valid) {
      el.setAttribute('aria-invalid', 'true');
      errorEl.classList.add('visible');
    } else {
      el.removeAttribute('aria-invalid');
      errorEl.classList.remove('visible');
    }
    return valid;
  }

  // Blur triggers validation; once invalid, input re-validates live
  [inputName, inputRole, inputStage].forEach(function (el) {
    el.addEventListener('blur', function () {
      if (el.value.trim() === '' || el.hasAttribute('aria-invalid')) {
        validateField(el);
      }
    });
    el.addEventListener('input', function () {
      if (el.hasAttribute('aria-invalid')) {
        validateField(el);
      }
    });
    el.addEventListener('change', function () {
      if (el.hasAttribute('aria-invalid')) {
        validateField(el);
      }
    });
  });

  /* ========== Submit ========== */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const nameValid = validateField(inputName);
    const roleValid = validateField(inputRole);
    const stageValid = validateField(inputStage);

    if (!nameValid || !roleValid || !stageValid) {
      if (!nameValid) inputName.focus();
      else if (!roleValid) inputRole.focus();
      else inputStage.focus();
      return;
    }

    const name = inputName.value.trim();
    const role = inputRole.value.trim();
    const stage = inputStage.value;
    const editId = editIdInput.value;

    if (editId) {
      const rec = records.find(function (r) { return r.id === editId; });
      if (rec) {
        rec.name = name;
        rec.role = role;
        rec.stage = stage;
      }
    } else {
      records.push({
        id: generateId(),
        name: name,
        role: role,
        stage: stage
      });
    }

    persist();
    dialog.close();
    render();
    showStorageAlert();
  });

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ========== Delete ========== */
  function deleteRecord(id) {
    const rec = records.find(function (r) { return r.id === id; });
    if (!rec) return;
    if (!confirm('确定删除「' + rec.name + '」的跟进记录吗？此操作不可撤销。')) return;
    records = records.filter(function (r) { return r.id !== id; });
    persist();
    render();
    showStorageAlert();
  }

  /* ========== Init ========== */
  loadRecords();
  render();
  showStorageAlert();

})();
</script>
</body>
</html>
