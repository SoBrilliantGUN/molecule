<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健身打卡</title>
  <style>
    /* ---- 设计令牌：数据面板方向，干净、紧凑、可扫读 ---- */
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --fg: #111827;
      --muted: #64748b;
      --border: #d8e2ee;
      --accent: #0ea5e9;
      --accent-soft: #e0f2fe;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --radius: 10px;
      --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.7;
      padding: 0 16px 48px;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- 骨架 ---- */
    .app {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      gap: 32px;
    }

    /* ---- 头部 ---- */
    header {
      padding: 28px 0 0;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px 24px;
    }
    .header-titles h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--fg);
    }
    .header-titles p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 2px;
      max-width: 48ch;
    }
    .stat-block {
      display: flex;
      align-items: baseline;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 18px 6px 14px;
      box-shadow: var(--shadow-sm);
    }
    .stat-block .num {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.2;
    }
    .stat-block .label {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ---- 主操作区：表单 ---- */
    .entry-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px 18px;
      box-shadow: var(--shadow-sm);
    }
    .entry-panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .entry-panel h2 svg { color: var(--accent); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
    }
    .form-grid .full { grid-column: 1 / -1; }

    .field { display: grid; gap: 4px; }
    .field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .field input {
      font: inherit;
      font-size: 0.95rem;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      transition: border-color 150ms, box-shadow 150ms;
      width: 100%;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .field input:user-invalid {
      border-color: var(--danger);
      background: var(--danger-soft);
    }
    .field .error-msg {
      font-size: 0.75rem;
      color: var(--danger);
      min-height: 1.2em;
      display: none;
    }
    .field .error-msg[role="alert"] { display: block; }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn-primary {
      font: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 9px 22px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 150ms, transform 100ms;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }
    .btn-primary:hover { background: #0284c7; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn-ghost {
      font: inherit;
      font-size: 0.85rem;
      padding: 6px 14px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 150ms, color 150ms;
      min-height: 36px;
    }
    .btn-ghost:hover { background: var(--bg); color: var(--fg); }
    .btn-ghost:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---- 提示条（存储降级等） ---- */
    .banner {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .banner button {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: inherit;
      padding: 0 4px;
      line-height: 1;
    }

    /* ---- 内容区：按日期分组 ---- */
    .log-section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .log-section h2 svg { color: var(--muted); }

    .date-group {
      margin-bottom: 28px;
    }
    .date-group:last-child { margin-bottom: 0; }
    .date-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 0 4px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .date-header .date-text {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--fg);
    }
    .date-header .date-count {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    .entry-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .entry-row:hover {
      border-color: #b0c4d9;
      box-shadow: var(--shadow-sm);
    }
    .entry-row .check {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border: 1.8px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms, border-color 150ms;
      padding: 0;
      color: transparent;
    }
    .entry-row .check:hover { border-color: var(--accent); }
    .entry-row .check:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .entry-row .check[aria-checked="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .entry-row .check svg { width: 12px; height: 12px; }

    .entry-row .info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .entry-row .exercise {
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .entry-row .meta {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-shrink: 0;
    }
    .entry-row .meta span { white-space: nowrap; }
    .entry-row .meta .weight { color: var(--fg); font-weight: 500; }

    .entry-row .actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 150ms, background 150ms;
      min-width: 28px;
      min-height: 28px;
    }
    .icon-btn:hover { color: var(--fg); background: var(--bg); }
    .icon-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }

    /* ---- 空状态 ---- */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }
    .empty-state svg {
      color: var(--border);
      margin-bottom: 12px;
    }
    .empty-state p {
      font-size: 0.95rem;
      margin-bottom: 16px;
      max-width: 36ch;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---- 编辑态 ---- */
    .edit-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 4px 0;
    }
    .edit-form input {
      font: inherit;
      font-size: 0.85rem;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--fg);
      width: 100px;
    }
    .edit-form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .edit-form input:user-invalid {
      border-color: var(--danger);
      background: var(--danger-soft);
    }
    .edit-form .btn-sm {
      font: inherit;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      min-height: 30px;
    }
    .edit-form .btn-sm.save {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .edit-form .btn-sm:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* ---- 响应式 ---- */
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .entry-row { flex-wrap: wrap; }
      .entry-row .info { flex-basis: 100%; order: 3; margin-top: 4px; }
      .entry-row .exercise { max-width: 100%; }
      .entry-row .actions { margin-left: auto; }
      .header-titles h1 { font-size: 1.4rem; }
      .stat-block { padding: 4px 14px 4px 10px; }
      .stat-block .num { font-size: 1.2rem; }
      .edit-form input { width: 80px; }
    }

    /* ---- 减少动效 ---- */
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }

    /* 辅助类 */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <header>
      <div class="header-titles">
        <h1>健身打卡</h1>
        <p>记录每一次举起，看见积累的力量。</p>
      </div>
      <div class="stat-block" aria-label="总打卡次数">
        <span class="num" id="totalCount">0</span>
        <span class="label">次打卡</span>
      </div>
    </header>

    <!-- 存储降级提示条（默认隐藏） -->
    <div class="banner" id="storageBanner" style="display:none;" role="status">
      <span>当前浏览器存储不可用，本次记录仅保存在当前会话中。</span>
      <button type="button" aria-label="关闭提示" onclick="this.parentElement.style.display='none'">×</button>
    </div>

    <!-- 主操作区：录入表单 -->
    <section class="entry-panel" aria-labelledby="entryTitle">
      <h2 id="entryTitle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        记录一次训练
      </h2>
      <form id="entryForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="dateInput">日期</label>
            <input type="date" id="dateInput" name="date" required aria-describedby="dateError">
            <span class="error-msg" id="dateError" role="alert"></span>
          </div>
          <div class="field">
            <label for="exerciseInput">动作名称</label>
            <input type="text" id="exerciseInput" name="exercise" placeholder="如：深蹲、卧推" required maxlength="40" aria-describedby="exerciseError">
            <span class="error-msg" id="exerciseError" role="alert"></span>
          </div>
          <div class="field">
            <label for="setsInput">组数</label>
            <input type="number" id="setsInput" name="sets" min="1" max="99" step="1" placeholder="3" required aria-describedby="setsError">
            <span class="error-msg" id="setsError" role="alert"></span>
          </div>
          <div class="field">
            <label for="weightInput">重量 (kg)</label>
            <input type="number" id="weightInput" name="weight" min="0" max="999" step="0.5" placeholder="60" required aria-describedby="weightError">
            <span class="error-msg" id="weightError" role="alert"></span>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            打卡
          </button>
          <button type="reset" class="btn-ghost">清空</button>
        </div>
      </form>
    </section>

    <!-- 内容区：按日期分组 -->
    <section class="log-section" aria-labelledby="logTitle">
      <h2 id="logTitle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        打卡记录
      </h2>
      <div id="logContainer"></div>
    </section>
  </div>

  <script>
    (function() {
      'use strict';

      // ---------- 安全存储层 ----------
      const STORAGE_KEY = 'workout_log_v1';
      let memoryStore = null;   // 降级时的内存存储
      let storageAvailable = true;

      function safeRead() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw === null) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          storageAvailable = false;
          return memoryStore ? memoryStore.slice() : [];
        }
      }

      function safeWrite(data) {
        memoryStore = data.slice();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          storageAvailable = true;
        } catch (e) {
          storageAvailable = false;
        }
        updateBanner();
      }

      function updateBanner() {
        const banner = document.getElementById('storageBanner');
        if (!storageAvailable) {
          banner.style.display = 'flex';
        } else {
          banner.style.display = 'none';
        }
      }

      // ---------- 数据 ----------
      let entries = safeRead();

      // 生成唯一 id
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      // ---------- 渲染 ----------
      const logContainer = document.getElementById('logContainer');
      const totalCountEl = document.getElementById('totalCount');

      function formatDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return parts[0] + '年' + parseInt(parts[1], 10) + '月' + parseInt(parts[2], 10) + '日';
      }

      function render() {
        // 更新总数
        totalCountEl.textContent = entries.length;

        if (entries.length === 0) {
          logContainer.innerHTML = `
            <div class="empty-state">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 4v16M18 4v16M3 8h3M18 8h3M3 16h3M18 16h3"/>
              </svg>
              <p>还没有训练记录。从今天开始，记下第一组动作吧。</p>
              <button type="button" class="btn-primary" id="emptyAddBtn" style="margin:0 auto;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                记录第一次训练
              </button>
            </div>
          `;
          const emptyBtn = document.getElementById('emptyAddBtn');
          if (emptyBtn) {
            emptyBtn.addEventListener('click', () => {
              const dateInput = document.getElementById('dateInput');
              dateInput.focus();
              // 滚动到真正的滚动容器（body）的顶部，避免 iframe 被顶走
              const formTop = document.querySelector('.entry-panel').offsetTop - 20;
              window.scrollTo({ top: formTop, behavior: 'smooth' });
            });
          }
          return;
        }

        // 按日期分组（降序）
        const groups = {};
        entries.forEach(e => {
          if (!groups[e.date]) groups[e.date] = [];
          groups[e.date].push(e);
        });
        const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

        let html = '';
        sortedDates.forEach(date => {
          const items = groups[date];
          html += `<div class="date-group">`;
          html += `<div class="date-header">
            <span class="date-text">${formatDate(date)}</span>
            <span class="date-count">${items.length} 项</span>
          </div>`;
          items.forEach(item => {
            html += renderRow(item);
          });
          html += `</div>`;
        });

        logContainer.innerHTML = html;
        bindRowEvents();
      }

      function renderRow(item) {
        const checked = item.done ? 'true' : 'false';
        const checkClass = item.done ? 'check' : 'check';
        return `
          <div class="entry-row" data-id="${item.id}">
            <button type="button" class="${checkClass}" role="checkbox" aria-checked="${checked}" aria-label="标记完成" data-action="toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
            <div class="info">
              <span class="exercise" title="${escapeHtml(item.exercise)}">${escapeHtml(item.exercise)}</span>
              <span class="meta">
                <span>${item.sets} 组</span>
                <span class="weight">${item.weight} kg</span>
              </span>
            </div>
            <div class="actions">
              <button type="button" class="icon-btn" data-action="edit" aria-label="编辑">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                </svg>
              </button>
              <button type="button" class="icon-btn danger" data-action="delete" aria-label="删除">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          </div>
        `;
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // ---------- 行内事件绑定 ----------
      function bindRowEvents() {
        logContainer.querySelectorAll('.entry-row').forEach(row => {
          const id = row.dataset.id;
          const toggleBtn = row.querySelector('[data-action="toggle"]');
          const editBtn = row.querySelector('[data-action="edit"]');
          const deleteBtn = row.querySelector('[data-action="delete"]');

          toggleBtn.addEventListener('click', () => {
            const entry = entries.find(e => e.id === id);
            if (entry) {
              entry.done = !entry.done;
              safeWrite(entries);
              render();
            }
          });

          editBtn.addEventListener('click', () => {
            const entry = entries.find(e => e.id === id);
            if (entry) startEdit(row, entry);
          });

          deleteBtn.addEventListener('click', () => {
            entries = entries.filter(e => e.id !== id);
            safeWrite(entries);
            render();
          });
        });
      }

      // ---------- 编辑模式 ----------
      function startEdit(row, entry) {
        const infoDiv = row.querySelector('.info');
        const actionsDiv = row.querySelector('.actions');
        const originalHtml = infoDiv.innerHTML;

        infoDiv.innerHTML = `
          <form class="edit-form" novalidate>
            <input type="text" name="exercise" value="${escapeHtml(entry.exercise)}" required maxlength="40" aria-label="动作名称">
            <input type="number" name="sets" value="${entry.sets}" min="1" max="99" step="1" required aria-label="组数" style="width:60px;">
            <input type="number" name="weight" value="${entry.weight}" min="0" max="999" step="0.5" required aria-label="重量" style="width:70px;">
            <button type="submit" class="btn-sm save">保存</button>
            <button type="button" class="btn-sm cancel">取消</button>
          </form>
        `;
        actionsDiv.style.display = 'none';

        const form = infoDiv.querySelector('.edit-form');
        const cancelBtn = form.querySelector('.cancel');

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const exercise = form.exercise.value.trim();
          const sets = parseInt(form.sets.value, 10);
          const weight = parseFloat(form.weight.value);

          if (!exercise || isNaN(sets) || sets < 1 || isNaN(weight) || weight < 0) {
            return;
          }

          entry.exercise = exercise;
          entry.sets = sets;
          entry.weight = weight;
          safeWrite(entries);
          render();
        });

        cancelBtn.addEventListener('click', () => {
          infoDiv.innerHTML = originalHtml;
          actionsDiv.style.display = '';
        });

        form.exercise.focus();
      }

      // ---------- 表单校验 ----------
      const form = document.getElementById('entryForm');
      const dateInput = document.getElementById('dateInput');
      const exerciseInput = document.getElementById('exerciseInput');
      const setsInput = document.getElementById('setsInput');
      const weightInput = document.getElementById('weightInput');

      // 默认日期为今天
      const today = new Date().toISOString().slice(0, 10);
      dateInput.value = today;

      function setError(input, errorEl, message) {
        if (message) {
          errorEl.textContent = message;
          errorEl.setAttribute('role', 'alert');
          input.setAttribute('aria-invalid', 'true');
        } else {
          errorEl.textContent = '';
          errorEl.removeAttribute('role');
          input.removeAttribute('aria-invalid');
        }
      }

      function validateDate() {
        const err = document.getElementById('dateError');
        if (!dateInput.value) {
          setError(dateInput, err, '请选择日期');
          return false;
        }
        setError(dateInput, err, '');
        return true;
      }

      function validateExercise() {
        const err = document.getElementById('exerciseError');
        if (!exerciseInput.value.trim()) {
          setError(exerciseInput, err, '请输入动作名称');
          return false;
        }
        setError(exerciseInput, err, '');
        return true;
      }

      function validateSets() {
        const err = document.getElementById('setsError');
        const val = setsInput.value;
        if (val === '' || isNaN(parseInt(val, 10)) || parseInt(val, 10) < 1) {
          setError(setsInput, err, '组数至少为 1');
          return false;
        }
        setError(setsInput, err, '');
        return true;
      }

      function validateWeight() {
        const err = document.getElementById('weightError');
        const val = weightInput.value;
        if (val === '' || isNaN(parseFloat(val)) || parseFloat(val) < 0) {
          setError(weightInput, err, '请输入有效重量');
          return false;
        }
        setError(weightInput, err, '');
        return true;
      }

      // 失焦校验
      dateInput.addEventListener('blur', validateDate);
      exerciseInput.addEventListener('blur', validateExercise);
      setsInput.addEventListener('blur', validateSets);
      weightInput.addEventListener('blur', validateWeight);

      // 输入时实时重校验（仅当已有错误时）
      function revalidateOnInput(input, validator) {
        input.addEventListener('input', () => {
          if (input.getAttribute('aria-invalid') === 'true') {
            validator();
          }
        });
      }
      revalidateOnInput(dateInput, validateDate);
      revalidateOnInput(exerciseInput, validateExercise);
      revalidateOnInput(setsInput, validateSets);
      revalidateOnInput(weightInput, validateWeight);

      // 提交
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const validDate = validateDate();
        const validExercise = validateExercise();
        const validSets = validateSets();
        const validWeight = validateWeight();

        if (!validDate || !validExercise || !validSets || !validWeight) {
          // 聚焦第一个错误字段
          if (!validDate) dateInput.focus();
          else if (!validExercise) exerciseInput.focus();
          else if (!validSets) setsInput.focus();
          else if (!validWeight) weightInput.focus();
          return;
        }

        const newEntry = {
          id: uid(),
          date: dateInput.value,
          exercise: exerciseInput.value.trim(),
          sets: parseInt(setsInput.value, 10),
          weight: parseFloat(weightInput.value),
          done: false
        };

        entries.push(newEntry);
        safeWrite(entries);
        render();

        // 重置表单，保留日期
        const keepDate = dateInput.value;
        form.reset();
        dateInput.value = keepDate;
        exerciseInput.focus();
      });

      // 重置时清除错误
      form.addEventListener('reset', () => {
        ['dateError', 'exerciseError', 'setsError', 'weightError'].forEach(id => {
          const el = document.getElementById(id);
          el.textContent = '';
          el.removeAttribute('role');
        });
        [dateInput, exerciseInput, setsInput, weightInput].forEach(inp => {
          inp.removeAttribute('aria-invalid');
        });
        // 重置后恢复日期为今天
        setTimeout(() => {
          dateInput.value = today;
        }, 0);
      });

      // ---------- 初始化渲染 ----------
      render();
      updateBanner();
    })();
  </script>
</body>
</html>
