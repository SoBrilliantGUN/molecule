services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atoms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atoms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atoms} -d ${POSTGRES_DB:-atoms}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./app/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atoms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atoms}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_MAIN_MODEL: ${LLM_MAIN_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      LLM_VERIFY_MODEL: ${LLM_VERIFY_MODEL:-zai-org/GLM-5.3}
      LLM_INTENT_MODEL: ${LLM_INTENT_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      FORGE_MAX_SECONDS: ${FORGE_MAX_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
